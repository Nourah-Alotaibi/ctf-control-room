tools:
  - {tool: file, level: FAST, mode: per_file, args: ["{file}"], timeout: 5}
  - {tool: strings, level: FAST, mode: per_file, args: ["-n","6","{file}"], timeout: 8}
  - {tool: grep, level: FAST, mode: per_file, args: ["-Eino","(password|secret|token|api[_-]?key|admin|debug|flag|TODO|FIXME)","{file}"], timeout: 6}
