tools:
  - {tool: file, level: FAST, mode: per_file, args: ["{file}"], timeout: 5}
  - {tool: grep, level: FAST, mode: per_file, args: ["-Eino","(access[_-]?key|secret|token|bucket|role|policy|endpoint|region)","{file}"], timeout: 6}
  - {tool: strings, level: FAST, mode: per_file, args: ["-n","6","{file}"], timeout: 8}
