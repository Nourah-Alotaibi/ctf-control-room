tools:
  - {tool: file, level: FAST, mode: per_file, args: ["{file}"], timeout: 5}
  - {tool: capinfos, level: FAST, mode: per_file, args: ["{file}"], timeout: 8}
  - {tool: tshark, level: FAST, mode: per_file, args: ["-r","{file}","-q","-z","io,phs"], timeout: 10}
  - {tool: strings, level: FAST, mode: per_file, args: ["-n","6","{file}"], timeout: 8}
